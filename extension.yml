schema_version: "1.0"

extension:
  id: "phase-orchestrator"
  name: "Phase Orchestrator"
  version: "2.1.0"
  description: "Orchestrate each Spec Kit tasks.md phase through isolated regression-baseline, test, implementation, verification, remediation, and documentation stages with parent-owned Git gates."
  author: "awasali14"
  repository: "https://github.com/awasali14/spec-kit-phase-orchestrator"
  homepage: "https://github.com/awasali14/spec-kit-phase-orchestrator"
  license: "MIT"

requires:
  speckit_version: ">=0.8.7"
  tools:
    - name: "python"
      version: ">=3.10"
      required: true
    - name: "git"
      required: true

provides:
  commands:
    - name: "speckit.phase-orchestrator.phase"
      file: "commands/speckit.phase-orchestrator.phase.md"
      description: "Use /speckit.phase-orchestrator.phase or $speckit-phase-orchestrator-phase to run Spec Kit tasks.md through isolated regression-baseline, test, implementation, verification, remediation, and documentation agents with parent-owned gated commits."

tags:
  - "workflow"
  - "implementation"
  - "orchestration"
  - "tasks"
