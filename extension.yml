schema_version: "1.0"

extension:
  id: "phase-orchestrator"
  name: "Phase Orchestrator"
  version: "1.0.0"
  description: "Spec Kit Phase Orchestrator will run tasks.md one phase at a time with isolated worker handoffs, focused validation, Markdown execution documents, and parent-owned post-phase commits."
  author: "awasali14"
  repository: "https://github.com/awasali14/spec-kit-phase-orchestrator"
  homepage: "https://github.com/awasali14/spec-kit-phase-orchestrator"
  license: "MIT"

requires:
  speckit_version: ">=0.8.7"
  tools:
    - name: "python"
      version: ">=3.10"
      required: true
    - name: "git"
      required: true

provides:
  commands:
    - name: "speckit.phase-orchestrator.phase"
      file: "commands/speckit.phase-orchestrator.phase.md"
      description: "Use /speckit.phase-orchestrator.phase or $speckit-phase-orchestrator-phase to run Spec Kit tasks.md one phase at a time with isolated workers, validation, docs, and parent-owned commits."

tags:
  - "workflow"
  - "implementation"
  - "orchestration"
  - "tasks"
